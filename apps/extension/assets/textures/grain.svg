<svg xmlns="http://www.w3.org/2000/svg" width="160" height="160" viewBox="0 0 160 160">
  <!-- 静态细颗粒纹理，仅用于装饰背景。 -->
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="3" seed="12" stitchTiles="stitch" />
    <feColorMatrix type="saturate" values="0" />
  </filter>
  <path fill="#fff" filter="url(#grain)" d="M0 0h160v160H0z" />
</svg>
